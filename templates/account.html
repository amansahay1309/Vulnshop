{% extends "base.html" %}
{% block content %}
<h1>Account</h1>
<!-- INTENTIONAL VULNERABILITY: IDOR/broken access control. Server displays requested user id. -->
<table border="1" cellpadding="8">
<tr><th>ID</th><td>{{ user["id"] }}</td></tr>
<tr><th>Username</th><td>{{ user["username"] }}</td></tr>
<tr><th>Role</th><td>{{ user["role"] }}</td></tr>
<tr><th>Email</th><td>{{ user["email"] }}</td></tr>
<!-- INTENTIONAL VULNERABILITY: sensitive data exposure. -->
<tr><th>Card Number</th><td>{{ user["card_number"] }}</td></tr>
<tr><th>API Key</th><td>{{ user["api_key"] }}</td></tr>
<!-- INTENTIONAL VULNERABILITY: password deliberately exposed. -->
<tr><th>Password</th><td>{{ user["password"] }}</td></tr>
</table>
<h2>Update Email</h2>
<!-- INTENTIONAL VULNERABILITY: no CSRF token. -->
<form method="POST" action="/account/update">
<input type="hidden" name="id" value="{{ user['id'] }}">
<label>Email</label><br><input name="email" value="{{ user['email'] }}"><br>
<button type="submit">Update</button>
</form>
{% endblock %}
