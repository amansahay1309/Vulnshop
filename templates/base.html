<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>vulnShop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        header { background: #222; color: white; padding: 18px 30px; }
        header a { color: white; margin-right: 18px; }
        main { max-width: 1100px; margin: 30px auto; background: white; padding: 25px; }
        .product { border: 1px solid #ddd; padding: 15px; margin: 12px 0; }
        .error { background: #ffd7d7; padding: 10px; margin: 10px 0; }
        .review { border-top: 1px solid #ddd; padding: 12px 0; }
        input, textarea, button { padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
<header>
    <strong>vulnShop</strong>
    <a href="/">Home</a>
    <a href="/search?q=shop">Search</a>
    {% if session.get("user_id") %}
        <a href="/account?id={{ session.get('user_id') }}">Account</a>
        <a href="/orders?id={{ session.get('user_id') }}">Orders</a>
        <a href="/logout">Logout</a>
    {% else %}
        <a href="/login">Login</a>
    {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
